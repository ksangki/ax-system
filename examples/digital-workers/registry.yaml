  audit: 없음
  continuity: 없음
  review:
    aal: A3
    floor_days: 90
    triggers: []
    retire_criteria: ''

- identity:
    agent_id: AGT-902
    name: 계약서 조항 비교 도구
    version: 1.1.0
    owner: 법무지원팀 계약 담당
    sponsor: 법무지원팀장
  status: active
