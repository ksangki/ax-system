<rect width="1000" height="600" fill="#f7f3ea"/><rect x="340" y="40" width="320" height="64" rx="10" fill="#16222e"/><text x="500.0" y="79.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle">조직의 자산·성과</text><rect x="180" y="160" width="640" height="150" rx="14" fill="none" stroke="#c9963f" stroke-width="3"/><text x="196" y="150" fill="#a87f3a" font-size="17" text-anchor="start" font-weight="700">거두는 체계 — 위가 공급하는 것</text><rect x="200" y="185" width="140" height="100" rx="10" fill="#fffdf8" stroke="#d9cfb8" stroke-width="2"/><text x="270.0" y="231.0" fill="#26231e" font-size="19" font-weight="700" text-anchor="middle">기준</text><text x="270.0" y="254.0" fill="#6f6a5e" font-size="15" text-anchor="middle">무엇을 등록할지</text><rect x="352" y="185" width="140" height="100" rx="10" fill="#fffdf8" stroke="#d9cfb8" stroke-width="2"/><text x="422.0" y="231.0" fill="#26231e" font-size="19" font-weight="700" text-anchor="middle">자원</text><text x="422.0" y="254.0" fill="#6f6a5e" font-size="15" text-anchor="middle">무엇으로 돌릴지</text><rect x="504" y="185" width="140" height="100" rx="10" fill="#fffdf8" stroke="#d9cfb8" stroke-width="2"/><text x="574.0" y="231.0" fill="#26231e" font-size="19" font-weight="700" text-anchor="middle">제도</text><text x="574.0" y="254.0" fill="#6f6a5e" font-size="15" text-anchor="middle">성과 인정 규칙</text><rect x="656" y="185" width="140" height="100" rx="10" fill="#fffdf8" stroke="#d9cfb8" stroke-width="2"/><text x="726.0" y="231.0" fill="#26231e" font-size="19" font-weight="700" text-anchor="middle">폐기</text><text x="726.0" y="254.0" fill="#6f6a5e" font-size="15" text-anchor="middle">내보내는 규칙</text><path d="M500,160 L500,112" fill="none" stroke="#c9963f" stroke-width="4" marker-end="url(#mg)"/><rect x="120" y="470" width="760" height="80" rx="12" fill="#efe7d4" stroke="#d9cfb8" stroke-width="2"/><circle cx="175" cy="500" r="7" fill="#c9963f"/><circle cx="257" cy="512" r="7" fill="#c9963f"/><circle cx="339" cy="524" r="7" fill="#c9963f"/><circle 