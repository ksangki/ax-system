<rect width="1000" height="540" fill="#f7f3ea"/><rect x="70" y="50" width="380" height="86" rx="10" fill="#16222e"/><text x="260.0" y="89.0" fill="#f3efe4" font-size="20" font-weight="700" text-anchor="middle">ACL — 할 수 있는 것</text><text x="260.0" y="113.0" fill="#c9b98f" font-size="14" text-anchor="middle">에이전트의 내재 역량 · 모델과 도구가 정한다</text><rect x="550" y="50" width="380" height="86" rx="10" fill="#fffdf8" stroke="#c9963f" stroke-width="3"/><text x="740" y="86" fill="#26231e" font-size="20" font-weight="700" text-anchor="middle">AAL — 해도 되는 것</text><text x="740" y="112" fill="#a87f3a" font-size="14" text-anchor="middle">조직이 허가한 범위 · 책임 수용 의사가 정한다</text><path d="M450,93 L548,93" fill="none" stroke="#c9963f" stroke-width="2.5" marker-end="url(#mg)" stroke-dasharray="7 5"/><text x="500" y="40" fill="#b4573f" font-size="14" text-anchor="middle">역량이 높아도 허가가 자동으로 오르지 않는다</text><path d="M500,220 L630,290 L500,360 L370,290 Z" fill="#fffdf8" stroke="#26231e" stroke-width="2.5"/><text x="500" y="284" fill="#26231e" font-size="19" text-anchor="middle" font-weight="700">배치 등급</text><text x="500" y="308" fill="#26231e" font-size="19" text-anchor="middle" font-weight="700">결정</text><path d="M260,136 L440,255" fill="none" stroke="#26231e" stroke-width="2" marker-end="url(#mi)"/><path d="M740,136 L560,255" fill="none" stroke="#c9963f" stroke-width="3.5" marker-end="url(#mg)"/><path d="M500,360 L500,430" fill="none" stroke="#c9963f" stroke-width="4" marker-end="url(#mg)"/><text x="630" y="400" fill="#6f6a5e" font-size="15" text-anchor="middle">둘 중 낮은 쪽을 따른다</text><rect x="330" y="432" width="340" height="70" rx="10" fill="#16222e"/><text x="500.0" y="474.35" fill="#f3efe4" font-size="21" font-weight="700" text-anchor="middle">운영 자율성</text></svg>
