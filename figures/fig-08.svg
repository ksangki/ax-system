nchor="middle">× 신뢰도 등급</text><path d="M794,162 L832,162" fill="none" stroke="#c9963f" stroke-width="3" marker-end="url(#mg)"/><text x="813" y="232" fill="#a87f3a" font-size="14" text-anchor="middle">× 자율성 계수</text><text x="240" y="290" fill="#6f6a5e" font-size="15" text-anchor="middle" font-weight="700">1단 환산 — 시간으로</text><text x="730" y="290" fill="#a87f3a" font-size="15" text-anchor="middle" font-weight="700">2단 — 두 계수는 다른 것을 보정한다 (믿을 수 있나 · 몫이 얼마인가)</text></svg>
